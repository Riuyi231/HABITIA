<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>HABITIA INMUEBLES</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="logo">H</div>
        <div class="brand-text">
          <div class="brand-name">HABITIA</div>
          <div class="brand-sub" id="brand-sub">Alquileres de estudios</div>
        </div>
      </div>
      <nav id="nav">
        <button class="nav-item" data-view="dashboard"><span class="ico">▦</span><span class="nav-label">Resumen</span></button>
        <button class="nav-item" data-view="cobros"><span class="ico">💰</span><span class="nav-label">Cobros del mes</span></button>
        <button class="nav-item" data-view="estudios"><span class="ico">🏠</span><span class="nav-label">Estudios</span></button>
        <button class="nav-item" data-view="inquilinos"><span class="ico">👤</span><span class="nav-label">Inquilinos</span></button>
        <button class="nav-item" data-view="contratos"><span class="ico">📄</span><span class="nav-label">Contratos</span></button>
        <button class="nav-item" data-view="gastos"><span class="ico">🧾</span><span class="nav-label">Gastos</span></button>
        <button class="nav-item" data-view="reporte"><span class="ico">📊</span><span class="nav-label">Reporte</span></button>
        <button class="nav-item" data-view="mantenimiento"><span class="ico">🔧</span><span class="nav-label">Mantenimiento</span></button>
        <button class="nav-item" data-view="empresa"><span class="ico">⚙</span><span class="nav-label">Empresa y datos</span></button>
      </nav>
      <div class="sidebar-footer">
        <span id="foot-info">—</span>
      </div>
    </aside>
    <main id="main">
      <header id="topbar">
        <div id="topbar-left">
          <button class="sidebar-toggle" id="sidebar-toggle" title="Mostrar/ocultar menú" aria-label="Mostrar/ocultar menú">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <div id="page-title">Resumen</div>
        </div>
        <div>
          <span id="empresa-nombre" class="empresa-chip">—</span>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="update-root"></div>

  <script src="app.js"></script>
  <script src="recibo.js"></script>
</body>
</html>
